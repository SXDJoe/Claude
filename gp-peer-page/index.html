<title>The Governance Paradox of Transformation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Sora:wght@300;400;600&display=swap">
<style>
/* Dark is the screen design. html.light is the print version (same layout, paper palette). */
:root{
  color-scheme:dark;
  --past:#17130F; --past-2:#201A14; --past-ink:#E3D6C3; --past-dim:#B1A28C; --past-acc:#D39A62; --past-rule:#3A3026;
  --future:#0B1117; --future-2:#101B24; --future-ink:#E6F1F8; --future-dim:#9DB2C1; --future-acc:#5CC8FF; --future-rule:#20303C;
  --act:#070707; --act-ink:#F2F2F2; --act-dim:#A7ABB0; --act-rule:#262626;
  --neutral:#F2F2F2; --bar:#1A2530; --pill:#0A0A0A;
  --serif:'Libre Caslon Text',Georgia,'Times New Roman',serif;
  --display:'Libre Caslon Display','Libre Caslon Text',Georgia,serif;
  --sans:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html.light{
  color-scheme:light;
  --past:#F7F1E7; --past-2:#EFE5D6; --past-ink:#2A2118; --past-dim:#65563F; --past-acc:#9A571C; --past-rule:#D8C7AF;
  --future:#EEF3F7; --future-2:#E1EAF1; --future-ink:#0F1D28; --future-dim:#475B6A; --future-acc:#17648C; --future-rule:#C5D3DD;
  --act:#FFFFFF; --act-ink:#151515; --act-dim:#555A60; --act-rule:#DDDDDD;
  --neutral:#1A1A1A; --bar:#D6E0E7; --pill:#FFFFFF;
}
*{box-sizing:border-box}
html,body{background:var(--future);color:var(--future-ink)}
body{margin:0;font-family:var(--sans);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,blockquote{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:400}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--future-acc);outline-offset:3px}

/* ---- 16:9 frames: every section is one 16:9 screen, type scales with the frame width ---- */
main{container-type:inline-size}
.frame{aspect-ratio:16/9;width:100%;position:relative;display:flex;flex-direction:column;justify-content:center;padding:4.2cqw 5.6cqw}
.frame>*{position:relative;z-index:1}
.seam::after{content:"";position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:linear-gradient(var(--past-acc),var(--future-acc));z-index:0}
.halves{background:linear-gradient(90deg,var(--past) 50%,var(--future) 50%)}
.past{background:var(--past);color:var(--past-ink)} .future{background:var(--future);color:var(--future-ink)}
.past .dim,.pdim{color:var(--past-dim)} .future .dim,.fdim{color:var(--future-dim)}
.pink{color:var(--past-ink)} .fink{color:var(--future-ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:11.2cqw}

/* type scale (frame-relative, with a readable floor) */
.t-body{font-size:max(15px,1.08cqw);line-height:1.6}
.t-small{font-size:max(13px,.92cqw);line-height:1.6}
.t-lead{font-size:max(18px,1.5cqw);line-height:1.45}
.t-big{font-size:max(22px,2.2cqw);line-height:1.3}
.t-h2{font-family:var(--display);font-size:max(34px,4.2cqw);line-height:1}
.eyebrow{font-size:max(12px,.85cqw);font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.past .eyebrow{color:var(--past-acc)} .future .eyebrow{color:var(--future-acc)}
.serif{font-family:var(--serif)}
.stack{display:flex;flex-direction:column;gap:1.7cqw}

/* 1 masthead */
.lockup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:11.2cqw;align-items:end}
.lockup .a{font-family:var(--display);font-size:max(44px,6.6cqw);line-height:.95;color:var(--past-ink)}
.lockup .b{font-family:var(--sans);font-weight:300;white-space:nowrap;font-size:max(26px,3.4cqw);line-height:1.02;letter-spacing:-.03em;color:var(--future-ink)}
.mast .two{margin-top:4.4cqw;align-items:end}

/* 2 decisions */
.decisions .l{font-family:var(--serif);font-size:max(26px,3cqw);line-height:1.2;color:var(--past-ink)}

/* 3 problem */
.problem .grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:3.4cqw;align-items:start}
.problem h2{font-family:var(--display);font-size:max(34px,4.4cqw);line-height:1}
.quote{position:relative;display:flex;flex-direction:column;gap:1.5cqw}
.quote::before{content:"\201C";position:absolute;left:-3.4cqw;top:-2.8cqw;font-family:var(--display);font-size:max(90px,11cqw);line-height:1;color:var(--past-acc);opacity:.35}
.quote p{font-family:var(--serif);font-size:max(17px,1.42cqw);line-height:1.5}
.quote p.hit{font-family:var(--display);font-size:max(28px,2.9cqw);line-height:1.1;color:var(--past-acc);margin-top:.8cqw}
.attrib{margin-top:2cqw;font-family:var(--serif);font-style:italic;font-size:max(14px,1.08cqw);color:var(--past-dim);display:flex;align-items:center;gap:1cqw}
.attrib::before{content:"";width:2.8cqw;height:1px;background:var(--past-acc)}

/* 4 questions + balanced counter */
.questions .grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);column-gap:4.2cqw;align-items:start}
.questions .intro{font-size:max(22px,2.2cqw);line-height:1.25}
.qlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--future-rule);counter-reset:q}
.qlist li{display:grid;grid-template-columns:4.2cqw 1fr;gap:1cqw;padding:1.1cqw 0;border-bottom:1px solid var(--future-rule);counter-increment:q;align-items:baseline}
.qlist li::before{content:counter(q);font-family:var(--display);font-size:max(26px,2.5cqw);line-height:1;color:var(--future-acc)}
.qlist p{font-size:max(16px,1.3cqw);line-height:1.4}
.counter{margin-top:2.2cqw;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:2cqw}
.side{display:flex;align-items:center;gap:1cqw;padding:.8cqw 1.1cqw;border:1px solid}
.side.b{border-color:var(--past-acc);background:var(--past);justify-content:flex-end}
.side.s{border-color:var(--future-acc);justify-content:flex-start}
.side .lbl{font-size:max(13px,.95cqw);flex:1}
.side.b .lbl{color:var(--past-ink);text-align:left} .side.s .lbl{color:var(--future-ink);text-align:right;order:3}
.side button{width:44px;height:44px;border:1px solid var(--future-rule);background:transparent;color:inherit;font-size:20px;cursor:pointer;flex:none}
.side.b button{border-color:var(--past-rule);color:var(--past-ink)}
.side button:hover{background:rgba(127,127,127,.12)}
.mid{display:flex;flex-direction:column;align-items:center;gap:.6cqw;min-width:18cqw}
.mid .val{font-family:var(--display);font-size:max(30px,3cqw);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.mid .val b{font-weight:400} .mid .val .vb{color:var(--past-acc)} .mid .val .vs{color:var(--future-acc)}
.mid .bar{display:flex;width:100%;height:10px;background:var(--bar)}
.mid .bar i{display:block;height:100%;transition:width .35s ease}
.side output{font-size:max(22px,1.9cqw);font-weight:600;min-width:2.4cqw;text-align:center;font-variant-numeric:tabular-nums}
.side.b output{color:var(--past-acc)} .side.s output{color:var(--future-acc)}

/* 5 collision */
.collide{text-align:center;align-items:center}
.collide .big{font-family:var(--display);font-size:max(38px,5.4cqw);line-height:1.02;max-width:15ch;
  background:linear-gradient(90deg,var(--past-acc) 0%,var(--past-ink) 42%,var(--future-ink) 58%,var(--future-acc) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.collide.seam::after{background:linear-gradient(var(--past-acc) 0,var(--past-acc) 9%,transparent 14%,transparent 86%,var(--future-acc) 91%,var(--future-acc) 100%)}
.collide .gov{font-size:max(18px,1.8cqw);line-height:1.3;margin-top:2.6cqw;max-width:30ch;color:var(--neutral)}
.collide .two{margin-top:4.4cqw;width:100%;text-align:left}
.collide .two p:first-child{font-family:var(--serif);color:var(--past-ink);text-align:right}
.collide .two p:last-child{color:var(--future-ink)}

/* 6 who */
.who .buyer{font-family:var(--serif);font-size:max(22px,2.2cqw);line-height:1.25}
.who .say{font-family:var(--serif);font-style:italic;font-size:max(20px,2cqw);line-height:1.35;border-top:1px solid var(--future-acc);padding-top:1.4cqw}
.who .not{font-weight:600}

/* 7 why */
.why h2{font-family:var(--display);font-size:max(30px,3.4cqw);line-height:1.05;max-width:24ch}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3cqw;margin-top:3cqw}
.role{border-top:1px solid var(--future-rule);padding-top:1.4cqw}
.owner{margin-top:3cqw;font-family:var(--serif);font-size:max(22px,2.4cqw);line-height:1.2;color:var(--future-acc);max-width:34ch}

/* 8 stage 1 */
.s1 .top{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);column-gap:4.2cqw;align-items:end}
.s1 h2{font-family:var(--display);font-size:max(30px,3.2cqw);line-height:1}
.stagehead{font-family:var(--serif);font-size:max(20px,2cqw);line-height:1.15}
.flow{height:2px;background:linear-gradient(90deg,var(--past-acc),var(--future-acc));margin:1.8cqw 0 1.2cqw}
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9cqw;counter-reset:p}
.part{background:var(--past-2);border:1px solid var(--past-rule);padding:1.3cqw;display:flex;flex-direction:column;gap:.6cqw;counter-increment:p}
.part:nth-child(n+3){background:var(--future-2);border-color:var(--future-rule)}
.part:last-child{border-color:var(--future-acc)}
.part::before{content:counter(p,decimal-leading-zero);font-size:max(11px,.8cqw);font-weight:600;letter-spacing:.1em}
.part:nth-child(-n+2)::before{color:var(--past-acc)} .part:nth-child(n+3)::before{color:var(--future-acc)}
.part h3{font-family:var(--serif);font-size:max(16px,1.4cqw);line-height:1.2}
.part:nth-child(-n+2) h3{color:var(--past-ink)}
.part p{font-size:max(12.5px,.94cqw);line-height:1.55;color:var(--future-dim)}
.part:nth-child(-n+2) p{color:var(--past-dim)}
.s1 .test{margin-top:1.6cqw;max-width:88ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.4cqw;margin-top:1.6cqw}
.facts p:first-child{font-family:var(--serif);font-size:max(17px,1.4cqw);line-height:1.3;color:var(--future-ink)}

/* 9 stage 2 */
.s2 .boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6cqw;margin-top:2.6cqw}
.box{border:1px solid var(--future-rule);padding:2cqw}
.box.key{border-color:var(--future-acc)}

/* 10 evidence */
.ev{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:4.4cqw;margin-top:2.6cqw}
.ev .ctx{font-family:var(--serif);font-style:italic;color:var(--past-dim)}
.pareto{display:flex;flex-direction:column;gap:.6cqw}
.pareto .row{display:flex;height:max(30px,2.6cqw);font-size:max(12px,.9cqw);font-weight:600}
.pareto .row span{display:flex;align-items:center;padding:0 .8cqw;white-space:nowrap}
.pareto .on{background:var(--past-acc);color:var(--past)} .pareto .off{flex:1;background:var(--past-2)}
.lesson{font-family:var(--display);font-size:max(22px,2.4cqw);line-height:1.15;color:var(--past-acc);margin-top:3cqw;max-width:34ch}

/* 11 not / partners */
.np h2{font-family:var(--serif);font-size:max(24px,2.4cqw);line-height:1.15}

/* 12 act */
.act{background:var(--act);color:var(--act-ink)}
.act .dim{color:var(--act-dim)}
.act .two{margin-top:2.4cqw}
.askq{margin-top:3.6cqw;display:flex;flex-direction:column;gap:1cqw}
.askq .lbl{font-size:max(12px,.9cqw);letter-spacing:.14em;text-transform:uppercase;color:var(--act-dim)}
.askq strong{font-family:var(--display);font-weight:400;font-size:max(30px,3.8cqw);line-height:1.05;max-width:24ch;
  background:linear-gradient(90deg,var(--past-acc),var(--past-ink) 45%,var(--future-ink) 60%,var(--future-acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.contact{margin-top:3.6cqw;padding-top:1.4cqw;border-top:1px solid var(--act-rule);display:flex;justify-content:space-between;align-items:baseline;gap:1cqw 3cqw;flex-wrap:wrap}
.contact .who2{display:flex;gap:.6cqw 2.2cqw;flex-wrap:wrap;align-items:baseline}
.contact .name{font-weight:600;color:var(--act-ink)}
.contact .sel{user-select:all;font-variant-numeric:tabular-nums;color:var(--act-ink)}

/* editor */
.editbar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:8px;align-items:center;background:#111;border:1px solid #333;padding:8px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);font:14px/1.4 var(--sans);color:#F2F2F2}
.editbar[hidden]{display:none}
.editbar button{min-height:40px;padding:0 14px;border-radius:6px;border:1px solid #3A3A3A;background:#1A1A1A;color:#F2F2F2;cursor:pointer;font:inherit}
.editbar button.primary{background:#F2F2F2;color:#111;border-color:#F2F2F2}
.editbar button:disabled{opacity:.45;cursor:default}
.editbar .msg{color:#A7ABB0;padding:0 6px;max-width:260px}
body.editing [data-k]{outline:1px dashed rgba(92,200,255,.55);outline-offset:4px;cursor:text}
body.editing [data-k]:focus{outline:2px solid var(--future-acc)}
body.editing [data-k].changed{outline-color:#F5C46B}
.loading{padding:120px 24px;color:var(--future-dim)}

/* phones and narrow windows: frames become normal flowing sections */
@media (max-width:820px){
  .frame{aspect-ratio:auto;padding:56px 20px}
  .two,.lockup,.problem .grid,.questions .grid,.s1 .top,.ev,.s2 .boxes{grid-template-columns:1fr;row-gap:22px}
  .halves{background:var(--past)} .seam::after{display:none}
  .halves .fink,.halves .fdim{color:var(--past-ink)}
  .mast .two{margin-top:28px}
  .collide .two p:first-child{text-align:left} .collide .two p:last-child{color:var(--past-ink)}
  .quote::before{left:-6px;top:-44px}
  .roles,.facts{grid-template-columns:1fr} .parts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .counter{grid-template-columns:1fr;gap:12px} .side.s .lbl{text-align:left}
  .lockup .b{white-space:normal}
}
@media (max-width:520px){.parts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:13.333in 7.5in;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .editbar,.counter{display:none!important}
  .frame{break-after:page;break-inside:avoid;height:7.5in;aspect-ratio:auto;overflow:hidden}
  .frame:last-child{break-after:auto}
  .frame{padding:3.4cqw 5.2cqw}
  .s1 .flow{margin:1.2cqw 0 .9cqw}
  .collide .big,.askq strong{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--past-ink)}
}
</style>

<main id="page"><p class="loading">Loading…</p></main>

<div class="editbar" id="editbar" hidden>
  <span class="msg" id="msg">Edit mode is off.</span>
  <button id="editBtn" type="button">Edit text</button>
  <button id="saveBtn" type="button" class="primary" hidden disabled>Save for everyone</button>
  <button id="cancelBtn" type="button" hidden>Discard</button>
</div>

<script>
(function(){
if(/(^|[?&#])light\b/.test(location.search+location.hash))document.documentElement.classList.add("light");
let C=null, original=null;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function get(path){return path.split(".").reduce((o,k)=>o==null?o:o[k],C)}
function set(path,val){const ks=path.split(".");let o=C;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks[ks.length-1]]=val}
/* every text element is bound to one entry in content.json */
const t=(tag,key,cls)=>`<${tag}${cls?` class="${cls}"`:""} data-k="${key}">${esc(get(key)??"")}</${tag}>`;

function lockup(){
  const full=C.title,i=full.indexOf(" of ");
  const a=i>0?full.slice(0,i):full,b=i>0?full.slice(i+1):"";
  return `<h1 class="lockup" data-k="title" data-lockup aria-label="${esc(full)}"><span class="a">${esc(a)}</span><span class="b">${esc(b)}</span></h1>`;
}

function render(){
  const q=C.questions.map((_,i)=>`<li>${t("p","questions."+i)}</li>`).join("");
  const parts=C.parts.map((_,i)=>`<div class="part">${t("h3","parts."+i+".name")}${t("p","parts."+i+".text")}</div>`).join("");
  const quote=C.problemQuote.map((_,i)=>t("p","problemQuote."+i,i===C.problemQuote.length-1?"hit":"")).join("");
  document.getElementById("page").innerHTML=`
<header class="frame halves seam mast">
  ${lockup()}
  <div class="two">${t("p","lede","serif t-lead pink")}${t("p","forPeers","t-body fdim")}</div>
</header>

<section class="frame halves seam decisions">
  <div class="two" style="align-items:end">${t("p","decisions","l")}${t("p","decisions2","t-lead fdim")}</div>
</section>

<section class="frame past problem" id="problem">
  <div class="grid">
    <div>${t("h2","problemHeading")}<p class="attrib">${t("span","problemAttribution")}</p></div>
    <blockquote class="quote">${quote}</blockquote>
  </div>
</section>

<section class="frame future questions">
  <div class="grid">
    ${t("p","questionsIntro","intro")}
    <ol class="qlist">${q}</ol>
  </div>
  <div class="counter" role="group" aria-label="Question 5: count it for a client you know">
    <div class="side b"><span class="lbl">the business changed</span><button type="button" data-r="biz" data-d="-1" aria-label="Fewer times the business changed">−</button><output id="bizV">0</output><button type="button" data-r="biz" data-d="1" aria-label="More times the business changed">+</button></div>
    <div class="mid"><div class="val"><span class="vb" id="bizR">0</span> <b>:</b> <span class="vs" id="sysR">0</span></div><div class="bar"><i id="bizB" style="width:50%;background:var(--past-acc)"></i><i id="sysB" style="width:50%;background:var(--future-acc)"></i></div></div>
    <div class="side s"><span class="lbl">the system changed</span><button type="button" data-r="sys" data-d="-1" aria-label="Fewer times the system changed">−</button><output id="sysV">0</output><button type="button" data-r="sys" data-d="1" aria-label="More times the system changed">+</button></div>
  </div>
</section>

<section class="frame halves seam collide">
  ${t("h2","collision","big")}
  ${t("p","governedBy","gov")}
  <div class="two">${t("p","insideOut","t-lead")}${t("p","outsideIn","t-lead")}</div>
</section>

<section class="frame halves seam who">
  <div class="two" style="align-items:start">
    <div class="stack">${t("h2","whoHeading","eyebrow")}${t("p","whoBuyer","buyer pink")}${t("p","whoMoment","t-body pdim")}${t("p","whoConsequence","t-body pdim")}</div>
    <div class="stack">${t("p","whoWordsLabel","eyebrow")}${t("p","whoQuote","say fink")}${t("p","whoNot","t-body not fink")}</div>
  </div>
</section>

<section class="frame future why">
  ${t("h2","whyHeading")}
  <div class="roles">${t("p","whyCio","role t-body")}${t("p","whyPd","role t-body")}${t("p","whyPartner","role t-body")}</div>
  ${t("p","whyOwner","owner")}
</section>

<section class="frame future s1">
  <div class="top">
    <div>${t("h2","howHeading")}${t("p","howIntro","t-body dim")}</div>
    <div>${t("h3","stage1Heading","stagehead")}${t("p","stage1Intro","t-body dim")}</div>
  </div>
  <div class="flow" aria-hidden="true"></div>
  <div class="parts">${parts}</div>
  ${t("p","testText","t-small test")}
  <div class="facts">${t("p","lands")}${t("p","moves","t-small dim")}${t("p","scope","t-small dim")}</div>
</section>

<section class="frame future s2">
  ${t("h3","stage2Heading","stagehead")}
  ${t("p","stage2Intro","t-lead dim")}
  <div class="boxes">
    ${t("p","stage2Forums","box t-body")}
    ${t("p","stage2Escalation","box key t-body")}
    ${t("p","stage2Term","box t-body dim")}
    ${t("p","stage2Alone","box t-body")}
  </div>
</section>

<section class="frame past evidence">

/* question 5 counter (screen only) */
const R={biz:0,sys:0};
function bindCounter(){
  document.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.r;R[k]=Math.max(0,Math.min(99,R[k]+Number(b.dataset.d)));
    const tot=R.biz+R.sys,p=tot?R.biz/tot*100:50;
    ["bizV","bizR"].forEach(id=>document.getElementById(id).textContent=R.biz);
    ["sysV","sysR"].forEach(id=>document.getElementById(id).textContent=R.sys);
    document.getElementById("bizB").style.width=p+"%";document.getElementById("sysB").style.width=(100-p)+"%";
  }));
}

/* ---------- editing: owner/editors only; saves content.json for everyone ---------- */
let editing=false,art=null;
const $=id=>document.getElementById(id);
const clean=s=>s.replace(/\s+/g," ").trim();
function msg(s){$("msg").textContent=s}
function setEditing(on){
  editing=on;document.body.classList.toggle("editing",on);
  if(on){const h=document.querySelector("[data-lockup]");h.textContent=C.title}
  document.querySelectorAll("[data-k]").forEach(el=>{
    if(on){el.setAttribute("contenteditable","plaintext-only");if(el.contentEditable!=="plaintext-only")el.setAttribute("contenteditable","true");el.spellcheck=true}
    else el.removeAttribute("contenteditable");
  });
  $("editBtn").hidden=on;$("saveBtn").hidden=!on;$("cancelBtn").hidden=!on;
  msg(on?"Click any text to change it.":"Edit mode is off.");
}
document.addEventListener("input",e=>{
  const el=e.target.closest&&e.target.closest("[data-k]");if(!el||!editing)return;
  el.classList.toggle("changed",clean(el.textContent)!==get(el.dataset.k));
  const n=document.querySelectorAll("[data-k].changed").length;
  $("saveBtn").disabled=!n;msg(n?`${n} change${n>1?"s":""} not saved yet.`:"Click any text to change it.");
});
document.addEventListener("keydown",e=>{if(editing&&e.key==="Enter"&&e.target.closest&&e.target.closest("[data-k]"))e.preventDefault()});
document.addEventListener("paste",e=>{
  if(!editing||!e.target.closest||!e.target.closest("[data-k]"))return;
  e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain").replace(/\s+/g," "));
});
$("editBtn").addEventListener("click",()=>setEditing(true));
$("cancelBtn").addEventListener("click",()=>{C=JSON.parse(original);render();setEditing(false);msg("Changes discarded.")});
$("saveBtn").addEventListener("click",async()=>{
  document.querySelectorAll("[data-k].changed").forEach(el=>set(el.dataset.k,clean(el.textContent)));
  const json=JSON.stringify(C,null,2)+"\n";
  $("saveBtn").disabled=true;msg("Saving…");
  try{await art.publish({"content.json":json});original=json;setEditing(false);render();msg("Saved. Everyone now sees the new text.")}
  catch(err){
    const code=err&&err.code;
    if(code==="conflict")msg("Someone saved at the same time. The page will reload with their version.");
    else if(code==="not_writer"||code==="not_granted")msg("You can read this page but not save changes.");
    else{msg("Saving is not available here. Your edits are still on the page.");$("saveBtn").disabled=false}
  }
});
async function initEditor(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [user,a]=await Promise.all([window.claude.use("user"),window.claude.use("artifact")]);
    if(a&&user&&(user.isOwner()||user.canEdit())){art=a;$("editbar").hidden=false}
  }catch(_){}
}

fetch("content.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
 .then(txt=>{original=txt;C=JSON.parse(txt);render();initEditor()})
 .catch(()=>{document.getElementById("page").innerHTML='<p class="loading">The page text could not be loaded. Reload the page to try again.</p>'});
})();
</script>
