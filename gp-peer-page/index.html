<title>The Governance Paradox of Transformation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Sora:wght@300;400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --past:#17130F; --past-2:#201A14; --past-ink:#E3D6C3; --past-dim:#B1A28C; --past-acc:#D39A62;
  --future:#0B1117; --future-2:#101B24; --future-ink:#E6F1F8; --future-dim:#9DB2C1; --future-acc:#5CC8FF;
  --line:#2C2C2C; --black:#070707;
  --serif:'Libre Caslon Text',Georgia,'Times New Roman',serif;
  --display:'Libre Caslon Display','Libre Caslon Text',Georgia,serif;
  --sans:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:clamp(16px,6vw,96px);
}
*{box-sizing:border-box}
html,body{background:var(--future);color:var(--future-ink)}
body{font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:400}
p{text-wrap:pretty}
a{color:var(--future-acc)}
:focus-visible{outline:2px solid var(--future-acc);outline-offset:3px}

/* worlds */
.past{background:var(--past);color:var(--past-ink)}
.future{background:var(--future);color:var(--future-ink)}
.past .dim{color:var(--past-dim)} .future .dim{color:var(--future-dim)}
.serif{font-family:var(--serif)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));position:relative}
.split::after{content:"";position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:linear-gradient(var(--past-acc),var(--future-acc));opacity:.9;pointer-events:none}
.split>*{padding:clamp(56px,8vw,120px) var(--gut)}
.pad{padding:clamp(64px,9vw,136px) var(--gut)}
.wrap{max-width:1180px;margin-inline:auto}
.eyebrow{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.past .eyebrow{color:var(--past-acc)} .future .eyebrow{color:var(--future-acc)}
.stack{display:flex;flex-direction:column;gap:24px}
.measure{max-width:64ch}

/* masthead */
.mast{background:linear-gradient(90deg,var(--past) 50%,var(--future) 50%);position:relative;padding:clamp(40px,6vw,72px) var(--gut) clamp(56px,8vw,112px)}
.mast::after{content:"";position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:linear-gradient(var(--past-acc),var(--future-acc))}
.mast-inner{position:relative;z-index:1;display:flex;flex-direction:column;gap:clamp(40px,6vw,80px)}
.lockup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:end;column-gap:calc(var(--gut)*2)}
.lockup .a{font-family:var(--display);font-size:clamp(44px,7.6vw,128px);line-height:.95;color:var(--past-ink);letter-spacing:-.01em}
.lockup .b{font-family:var(--sans);font-weight:300;white-space:nowrap;font-size:clamp(26px,3.5vw,60px);line-height:1.02;color:var(--future-ink);letter-spacing:-.03em}
.lockup .b em{font-style:normal;color:var(--future-acc)}
.mast .lede{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:calc(var(--gut)*2)}
.mast .lede p:first-child{font-family:var(--serif);font-size:clamp(20px,2.1vw,30px);line-height:1.35;color:var(--past-ink)}
.mast .lede p:last-child{font-size:clamp(15px,1.25vw,18px);color:var(--future-dim);align-self:end}

/* decisions */
.decisions .l p{font-family:var(--serif);font-size:clamp(26px,3.2vw,48px);line-height:1.2}
.decisions .r p{font-size:clamp(18px,1.6vw,22px);align-self:end}
.decisions .r{display:flex;align-items:flex-end}

/* problem */
.problem{background:var(--past);color:var(--past-ink);position:relative;overflow:hidden}
.problem .head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:clamp(40px,6vw,72px)}
.problem h2{font-family:var(--display);font-size:clamp(44px,6vw,96px);line-height:1}
.quote{position:relative;display:flex;flex-direction:column;gap:clamp(22px,2.4vw,34px);max-width:1040px}
.quote::before{content:"\201C";position:absolute;left:clamp(-8px,-3.2vw,-56px);top:-.62em;font-family:var(--display);font-size:clamp(120px,16vw,240px);line-height:1;color:var(--past-acc);opacity:.35}
.quote p{font-family:var(--serif);font-size:clamp(21px,2.1vw,31px);line-height:1.45}
.quote p.hit{font-family:var(--display);font-size:clamp(34px,4.6vw,72px);line-height:1.08;color:var(--past-acc);margin-top:clamp(12px,2vw,28px)}
.attrib{margin-top:clamp(28px,3vw,44px);font-family:var(--serif);font-style:italic;font-size:18px;color:var(--past-dim);display:flex;align-items:center;gap:16px}
.attrib::before{content:"";width:40px;height:1px;background:var(--past-acc)}

/* questions */
.questions{background:var(--future)}
.questions .intro{font-size:clamp(24px,2.6vw,38px);line-height:1.25;max-width:26ch;margin-bottom:clamp(40px,5vw,64px)}
.qlist{list-style:none;margin:0;padding:0;border-top:1px solid #20303C;counter-reset:q}
.qlist li{display:grid;grid-template-columns:clamp(48px,7vw,110px) 1fr;gap:16px;padding:clamp(22px,2.6vw,34px) 0;border-bottom:1px solid #20303C;counter-increment:q}
.qlist li::before{content:counter(q);font-family:var(--display);font-size:clamp(34px,4vw,56px);line-height:1;color:var(--future-acc)}
.qlist p{font-size:clamp(19px,1.9vw,27px);line-height:1.4;font-weight:300}
.ratio{margin-top:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:760px}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border:1px solid;flex-wrap:wrap}
.ctr.b{border-color:var(--past-acc)} .ctr.s{border-color:var(--future-acc)}
.ctr span.lbl{font-size:14px;color:var(--future-dim)}
.ctr .n{display:flex;align-items:center;gap:10px}
.ctr button{width:44px;height:44px;border:1px solid #3A4650;background:transparent;color:var(--future-ink);font-size:20px;cursor:pointer}
.ctr button:hover{background:rgba(255,255,255,.07)}
.ctr output{min-width:40px;text-align:center;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.ctr.b output{color:var(--past-acc)} .ctr.s output{color:var(--future-acc)}
.ratiobar{grid-column:1/-1;display:flex;height:14px;background:#1A2530}
.ratiobar i{display:block;height:100%;transition:width .35s ease}

/* collision */
.collide{position:relative;background:linear-gradient(90deg,var(--past) 50%,var(--future) 50%);padding:clamp(88px,12vw,180px) var(--gut);overflow:hidden}
.collide::after{content:"";position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:linear-gradient(var(--past-acc) 0,var(--past-acc) 9%,transparent 14%,transparent 86%,var(--future-acc) 91%,var(--future-acc) 100%)}
.collide .big{position:relative;z-index:1;text-align:center;font-family:var(--display);font-size:clamp(40px,7.4vw,124px);line-height:1;letter-spacing:-.01em;max-width:15ch;margin-inline:auto;
  background:linear-gradient(90deg,var(--past-acc) 0%,var(--past-ink) 42%,var(--future-ink) 58%,var(--future-acc) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.collide .gov{position:relative;z-index:1;text-align:center;font-size:clamp(20px,2.2vw,32px);line-height:1.3;margin:clamp(32px,4vw,56px) auto 0;max-width:30ch;color:#F2F2F2}
.collide .views{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:calc(var(--gut)*2);margin-top:clamp(56px,7vw,104px)}
.collide .views p{font-size:clamp(17px,1.5vw,21px);line-height:1.5}
.collide .views p:first-child{font-family:var(--serif);color:var(--past-ink);text-align:right}
.collide .views p:last-child{color:var(--future-ink)}

/* who */
.who .l .buyer{font-family:var(--serif);font-size:clamp(24px,2.6vw,38px);line-height:1.25}
.who .say{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.2vw,32px);line-height:1.35;border-top:1px solid var(--future-acc);padding-top:20px}
.who .not{font-weight:600}

/* why */
.why h2{font-family:var(--display);font-size:clamp(32px,4.2vw,64px);line-height:1.05;max-width:22ch}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(40px,5vw,72px)}
.role{border-top:1px solid #20303C;padding-top:22px;display:flex;flex-direction:column;gap:14px}
.role p{font-size:17px}
.owner{margin-top:clamp(40px,5vw,72px);font-family:var(--serif);font-size:clamp(24px,2.8vw,42px);line-height:1.2;color:var(--future-acc);max-width:30ch}

/* how */
.how h2{font-family:var(--display);font-size:clamp(44px,6vw,96px);line-height:1}
.stagehead{font-family:var(--serif);font-size:clamp(26px,3vw,44px);line-height:1.15}
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:p}
.part{background:var(--past-2);border:1px solid #3A3026;padding:22px;display:flex;flex-direction:column;gap:10px;counter-increment:p;position:relative}
.part:nth-child(n+3){background:var(--future-2);border-color:#1F3645}
.part:last-child{border-color:var(--future-acc)}
.part::before{content:counter(p,decimal-leading-zero);font-size:13px;font-weight:600;letter-spacing:.1em}
.part:nth-child(-n+2)::before{color:var(--past-acc)} .part:nth-child(n+3)::before{color:var(--future-acc)}
.part h3{font-family:var(--serif);font-size:22px;line-height:1.2}
.part:nth-child(-n+2) h3{color:var(--past-ink)}
.part p{font-size:15px;line-height:1.6;color:var(--future-dim)}
.part:nth-child(-n+2) p{color:var(--past-dim)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;height:2px;background:linear-gradient(90deg,var(--past-acc),var(--future-acc));margin:6px 0 2px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.facts p{font-size:16px}
.facts p:first-child{font-family:var(--serif);font-size:clamp(20px,1.8vw,26px);line-height:1.3;color:var(--future-ink)}
.chain{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,48px)}
.stage2-box{border:1px solid #20303C;padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:14px}

/* evidence */
.evidence h2{font-family:var(--display);font-size:clamp(44px,6vw,96px);line-height:1}
.ev{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,5vw,80px);margin-top:clamp(36px,5vw,64px)}
.ev .ctx{font-family:var(--serif);font-style:italic;color:var(--past-dim)}
.pareto{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.pareto .bar{display:flex;height:44px;font-size:13px;font-weight:600}
.pareto .bar span{display:flex;align-items:center;padding:0 12px;white-space:nowrap}
.lesson{font-family:var(--display);font-size:clamp(26px,3vw,44px);line-height:1.15;color:var(--past-acc);margin-top:clamp(40px,5vw,64px);max-width:26ch}

/* not / partners */
.np h2{font-family:var(--serif);font-size:clamp(26px,2.6vw,38px);line-height:1.15}
.np .stack{gap:18px}

/* act */
.act{background:var(--black);color:#F2F2F2}
.act h2{font-family:var(--display);font-size:clamp(44px,6vw,96px);line-height:1}
.act .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,4vw,64px);margin-top:clamp(36px,5vw,64px)}
.act .cols p{font-size:clamp(17px,1.4vw,20px);color:#C9CDD2}
.askq{margin-top:clamp(56px,7vw,104px);display:flex;flex-direction:column;gap:18px}
.askq .lbl{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#9A9FA6}
.askq strong{font-family:var(--display);font-weight:400;font-size:clamp(34px,5.2vw,84px);line-height:1.04;max-width:20ch;
  background:linear-gradient(90deg,var(--past-acc),var(--past-ink) 45%,var(--future-ink) 60%,var(--future-acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.sig{margin-top:clamp(64px,8vw,120px);padding-top:24px;border-top:1px solid #262626;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:15px;color:#A7ABB0}
.sig .mail{font-variant-numeric:tabular-nums;color:#F2F2F2;user-select:all}

/* editor */
.editbar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:8px;align-items:center;background:#111;border:1px solid #333;padding:8px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px}
.editbar[hidden]{display:none}
.editbar button{min-height:40px;padding:0 14px;border-radius:6px;border:1px solid #3A3A3A;background:#1A1A1A;color:#F2F2F2;cursor:pointer;font:inherit}
.editbar button.primary{background:#F2F2F2;color:#111;border-color:#F2F2F2}
.editbar button:disabled{opacity:.45;cursor:default}
.editbar .msg{color:#A7ABB0;padding:0 6px;max-width:260px}
body.editing [data-k]{outline:1px dashed rgba(92,200,255,.5);outline-offset:4px;border-radius:2px;cursor:text}
body.editing [data-k]:focus{outline:2px solid var(--future-acc);background:rgba(92,200,255,.06)}
body.editing [data-k].changed{outline-color:#F5C46B}
.loading{padding:120px var(--gut);color:var(--future-dim)}

@media (max-width:820px){
  .split,.lockup,.mast .lede,.collide .views,.chain,.ev,.act .cols{grid-template-columns:1fr}
  .split::after,.mast::after,.collide::after{display:none}
  .mast,.collide{background:var(--past)}
  .lockup{row-gap:14px} .lockup .b{color:var(--future-ink)}
  .mast .lede{row-gap:20px} .mast .lede p:last-child{color:var(--past-dim)}
  .collide .views{row-gap:18px} .collide .views p:first-child{text-align:left}
  .collide .views p:last-child{color:var(--past-ink)}
  .parts{grid-template-columns:repeat(2,minmax(0,1fr))} .roles,.facts{grid-template-columns:1fr}
  .flow{display:none}
  .quote::before{left:-6px;top:-.5em}
  .ratio{grid-template-columns:1fr}
}
@media (max-width:520px){ .parts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:11pt}
  .editbar,.ratio{display:none!important}
  section,.split,.mast,.collide{break-inside:auto}
  .part,.role,.qlist li,.stage2-box,.quote p{break-inside:avoid}
  .collide .big,.askq{break-inside:avoid}
  p,h2,h3,blockquote{break-inside:avoid}
  .problem{break-before:page}
  .collide .big,.askq strong{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#EFE4D4}
  html,body{background:var(--future)}
}
</style>

<main id="page"><p class="loading">Loading…</p></main>

<div class="editbar" id="editbar" hidden>
  <span class="msg" id="msg">Edit mode is off.</span>
  <button id="editBtn" type="button">Edit text</button>
  <button id="saveBtn" type="button" class="primary" hidden disabled>Save for everyone</button>
  <button id="cancelBtn" type="button" hidden>Discard</button>
</div>

<script>
(function(){
let C=null, original=null;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* t(key) renders an editable text node bound to a path in content.json */
const t=(tag,key,cls)=>`<${tag}${cls?` class="${cls}"`:""} data-k="${key}">${esc(get(key))}</${tag}>`;
function get(path){return path.split(".").reduce((o,k)=>o==null?o:o[k],C)}
function set(path,val){const ks=path.split(".");let o=C;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks[ks.length-1]]=val}

function lockup(){
  // "The Governance Paradox" / "of Transformation": the name split across the two worlds.
  const full=C.title, i=full.indexOf(" of ");
  const a=i>0?full.slice(0,i):full, b=i>0?full.slice(i+1):"";
  return `<h1 class="lockup" data-k="title" data-lockup aria-label="${esc(full)}"><span class="a">${esc(a)}</span><span class="b">${esc(b)}</span></h1>`;
}

function render(){
  const q=C.questions.map((_,i)=>`<li>${t("p","questions."+i)}</li>`).join("");
  const parts=C.parts.map((_,i)=>`<div class="part">${t("h3","parts."+i+".name")}${t("p","parts."+i+".text")}</div>`).join("");
  const quote=C.problemQuote.map((_,i)=>t("p","problemQuote."+i,i===C.problemQuote.length-1?"hit":"")).join("");
  document.getElementById("page").innerHTML=`
<header class="mast"><div class="mast-inner">
  ${lockup()}
  <div class="lede">${t("p","lede")}${t("p","forPeers")}</div>
</div></header>

<section class="split decisions">
  <div class="past l">${t("p","decisions")}</div>
  <div class="future r">${t("p","decisions2","dim")}</div>
</section>

<section class="problem pad" id="problem"><div class="wrap">
  <div class="head">${t("h2","problemHeading")}</div>
  <blockquote class="quote" style="margin:0">${quote}</blockquote>
  <p class="attrib">${t("span","problemAttribution")}</p>
</div></section>

<section class="questions pad"><div class="wrap">
  ${t("p","questionsIntro","intro")}
  <ol class="qlist">${q}</ol>
  <div class="ratio" aria-label="Count it for a client you know">
    <div class="ctr b"><span class="lbl">the business changed</span><span class="n"><button type="button" data-r="biz" data-d="-1" aria-label="Fewer times the business changed">−</button><output id="bizV">0</output><button type="button" data-r="biz" data-d="1" aria-label="More times the business changed">+</button></span></div>
    <div class="ctr s"><span class="lbl">the system changed</span><span class="n"><button type="button" data-r="sys" data-d="-1" aria-label="Fewer times the system changed">−</button><output id="sysV">0</output><button type="button" data-r="sys" data-d="1" aria-label="More times the system changed">+</button></span></div>
    <div class="ratiobar"><i id="bizB" style="width:50%;background:var(--past-acc)"></i><i id="sysB" style="width:50%;background:var(--future-acc)"></i></div>
  </div>
</div></section>

<section class="collide" aria-label="${esc(C.collision)}">
  ${t("h2","collision","big")}
  ${t("p","governedBy","gov")}
  <div class="views">${t("p","insideOut")}${t("p","outsideIn")}</div>
</section>

<section class="split who">
  <div class="past l stack">${t("h2","whoHeading","eyebrow")}${t("p","whoBuyer","buyer")}${t("p","whoMoment","dim measure")}${t("p","whoConsequence","dim measure")}</div>
  <div class="future r stack">${t("p","whoWordsLabel","eyebrow")}${t("p","whoQuote","say")}${t("p","whoNot","not")}</div>
</section>

<section class="why future pad"><div class="wrap">
  ${t("h2","whyHeading")}
  <div class="roles">
    <div class="role">${t("p","whyCio")}</div>
    <div class="role">${t("p","whyPd")}</div>
    <div class="role">${t("p","whyPartner")}</div>
  </div>
  ${t("p","whyOwner","owner")}
</div></section>

<section class="how future pad" style="border-top:1px solid #1A2530"><div class="wrap stack" style="gap:clamp(28px,3.5vw,48px)">
  <div class="stack" style="gap:10px">${t("h2","howHeading")}${t("p","howIntro","dim")}</div>
  <div class="stack" style="gap:18px">${t("h3","stage1Heading","stagehead")}${t("p","stage1Intro","dim")}</div>
  <div class="flow" aria-hidden="true"></div>
  <div class="parts">${parts}</div>
  ${t("p","testText","measure")}
  <div class="facts">${t("p","lands")}${t("p","moves","dim")}${t("p","scope","dim")}</div>
  <div class="stack" style="gap:18px;margin-top:clamp(24px,4vw,56px)">${t("h3","stage2Heading","stagehead")}${t("p","stage2Intro","dim")}</div>
  <div class="chain">
    <div class="stage2-box">${t("p","stage2Forums")}</div>
    <div class="stage2-box" style="border-color:var(--future-acc)">${t("p","stage2Escalation")}</div>
    <div class="stage2-box">${t("p","stage2Term","dim")}</div>
    <div class="stage2-box">${t("p","stage2Alone")}</div>
  </div>
</div></section>

<section class="evidence past pad"><div class="wrap">
  ${t("h2","evidenceHeading")}
  <div class="ev">
    <div class="stack">${t("p","evidenceContext","ctx")}${t("p","evidenceClaim")}
      <div class="pareto" aria-hidden="true">
        <div class="bar"><span style="width:10%;min-width:64px;background:var(--past-acc);color:var(--past)">10%</span><span style="flex:1;background:#2A2219"></span></div>

      </div>
    </div>

</div></section>

/* ratio counter for question 5 (screen only) */
const R={biz:0,sys:0};
function bindRatio(){
  document.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.r;R[k]=Math.max(0,Math.min(99,R[k]+Number(b.dataset.d)));
    const tot=R.biz+R.sys,p=tot?R.biz/tot*100:50;
    document.getElementById("bizV").textContent=R.biz;document.getElementById("sysV").textContent=R.sys;
    document.getElementById("bizB").style.width=p+"%";document.getElementById("sysB").style.width=(100-p)+"%";
  }));
}

/* ---------- editing: owner/editors only, saves content.json for everyone ---------- */
let editing=false, art=null;
const $=id=>document.getElementById(id);
function msg(s){$("msg").textContent=s}
function fields(){return [...document.querySelectorAll("[data-k]")]}
function setEditing(on){
  editing=on;document.body.classList.toggle("editing",on);
  fields().forEach(el=>{
    if(on){el.setAttribute("contenteditable","plaintext-only");if(el.contentEditable!=="plaintext-only")el.setAttribute("contenteditable","true");el.setAttribute("spellcheck","true")}
    else{el.removeAttribute("contenteditable")}
  });
  if(on){ // the split title edits as one line of plain text
    const h=document.querySelector("[data-lockup]");h.textContent=C.title;
  }
  $("editBtn").hidden=on;$("saveBtn").hidden=!on;$("cancelBtn").hidden=!on;
  msg(on?"Click any text to change it.":"Edit mode is off.");
}
document.addEventListener("input",e=>{
  const el=e.target.closest&&e.target.closest("[data-k]");if(!el||!editing)return;
  el.classList.toggle("changed",clean(el.textContent)!==get(el.dataset.k));
  const n=document.querySelectorAll("[data-k].changed").length;
  $("saveBtn").disabled=!n;msg(n?`${n} change${n>1?"s":""} not saved yet.`:"Click any text to change it.");
});
document.addEventListener("keydown",e=>{
  if(editing&&e.key==="Enter"&&e.target.closest&&e.target.closest("[data-k]")){e.preventDefault()}
});
document.addEventListener("paste",e=>{
  if(!editing||!e.target.closest||!e.target.closest("[data-k]"))return;
  e.preventDefault();const txt=(e.clipboardData||window.clipboardData).getData("text/plain").replace(/\s+/g," ");
  document.execCommand("insertText",false,txt);
});
const clean=s=>s.replace(/\s+/g," ").trim();
$("editBtn").addEventListener("click",()=>setEditing(true));
$("cancelBtn").addEventListener("click",()=>{C=JSON.parse(original);render();setEditing(false);msg("Changes discarded.")});
$("saveBtn").addEventListener("click",async()=>{
  const changed=[...document.querySelectorAll("[data-k].changed")];
  changed.forEach(el=>set(el.dataset.k,clean(el.textContent)));
  const json=JSON.stringify(C,null,2)+"\n";
  $("saveBtn").disabled=true;msg("Saving…");
  try{
    await art.publish({"content.json":json});
    original=json;setEditing(false);render();msg("Saved. Everyone now sees the new text.");
  }catch(err){
    const code=err&&err.code;
    if(code==="conflict")msg("Someone saved at the same time. The page will reload with their version.");
    else if(code==="not_writer"||code==="not_granted")msg("You can read this page but not save changes.");
    else{msg("Saving is not available here. Your edits are still on the page.");$("saveBtn").disabled=false}
  }
});

async function initEditor(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [user,a]=await Promise.all([window.claude.use("user"),window.claude.use("artifact")]);
    const can=user?(user.isOwner()||user.canEdit()):false;
    if(a&&can){art=a;$("editbar").hidden=false}
  }catch(_){}
}

fetch("content.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
 .then(txt=>{original=txt;C=JSON.parse(txt);render();initEditor()})
 .catch(()=>{document.getElementById("page").innerHTML='<p class="loading">The page text could not be loaded. Reload the page to try again.</p>'});
})();
</script>
