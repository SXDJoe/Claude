<title>GP Design Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;600&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@300;400;500&family=Instrument+Sans:wght@400;500&family=Libre+Caslon+Text:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Sora:wght@300;400;600&family=Unbounded:wght@300;500&display=swap">
<style>
:root{color-scheme:dark;--ui-bg:#0E0E10;--ui-panel:#16161A;--ui-line:#2A2A31;--ui-fg:#ECECEF;--ui-dim:#9D9DA8;--ui-hi:#F5C46B;
--bg:#12100E;--bg2:#12100E;--fg:#ECE6DC;--muted:#A59C8F;--line:#2B2723;--accent:#D2B084;--accent2:#D2B084;--display:'Newsreader',serif;--body:'Instrument Sans',sans-serif;--mono:'Geist Mono',ui-monospace,monospace;--scale:1;--space:1}
*{box-sizing:border-box}
html,body{background:var(--ui-bg);color:var(--ui-fg)}
body{font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ui-hi);outline-offset:2px}

/* ---------- app chrome ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,14,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ui-line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px}
.brand{font-weight:500;letter-spacing:.04em;margin-right:8px;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.tab{border:1px solid var(--ui-line);background:transparent;padding:8px 12px;border-radius:6px;cursor:pointer;min-height:40px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ui-fg);color:#111;border-color:var(--ui-fg)}
.tab small{opacity:.6;margin-right:6px;font-variant-numeric:tabular-nums}
.tbtn{border:1px solid var(--ui-line);background:var(--ui-panel);padding:8px 12px;border-radius:6px;cursor:pointer;min-height:40px}
.tbtn[aria-pressed="true"]{border-color:var(--ui-hi);color:var(--ui-hi)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:calc(100vh - 62px)}
.layout.closed{grid-template-columns:minmax(0,1fr) 0}
.layout.closed .panel{display:none}
.panel{border-left:1px solid var(--ui-line);background:var(--ui-panel);padding:20px 18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.panel h2{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ui-dim);font-weight:500}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--ui-dim)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color{display:flex;align-items:center;gap:8px;border:1px solid var(--ui-line);border-radius:6px;padding:4px 8px;background:#0F0F12}
.color input[type=color]{width:32px;height:32px;border:0;background:none;padding:0;cursor:pointer}
.color code{font-size:12px;color:var(--ui-dim)}
.panel select{background:#0F0F12;border:1px solid var(--ui-line);border-radius:6px;padding:8px;min-height:40px}
.panel input[type=range]{width:100%;accent-color:var(--ui-hi)}
.hint{font-size:12px;line-height:1.5;color:var(--ui-dim);margin:0}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ui-fg);color:#111;padding:10px 16px;border-radius:6px;font-weight:500;z-index:40}
.editing .stage [data-edit]{outline:1px dashed rgba(245,196,107,.45);outline-offset:3px;cursor:text}
.stage{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
.stage *{box-sizing:border-box}
.stage h1,.stage h2,.stage h3,.stage p{margin:0;text-wrap:balance}
.stage p{text-wrap:pretty}
.sp{padding:calc(96px*var(--space)) clamp(16px,7vw,120px)}
.ey{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.fs-xxl{font-size:calc(clamp(40px,6.2vw,92px)*var(--scale));line-height:1.03}
.fs-xl{font-size:calc(clamp(32px,4.2vw,64px)*var(--scale));line-height:1.08}
.fs-l{font-size:calc(clamp(24px,2.8vw,44px)*var(--scale));line-height:1.18}
.fs-m{font-size:calc(clamp(19px,2vw,32px)*var(--scale));line-height:1.3}
.fs-s{font-size:calc(clamp(16px,1.3vw,20px)*var(--scale));line-height:1.6}
.fs-xs{font-size:calc(15px*var(--scale));line-height:1.6}
.muted{color:var(--muted)}
.acc{color:var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(20px*var(--space))}
.split2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(56px*var(--space))}
.stack{display:flex;flex-direction:column;gap:calc(24px*var(--space))}
.stage button{cursor:pointer}

/* ---------- 01 Quiet Authority ---------- */
.d-quiet .disp{font-family:var(--display);font-weight:300}
.d-quiet .hero{display:flex;flex-direction:column;gap:calc(72px*var(--space))}
.d-quiet .top{display:flex;justify-content:space-between;gap:16px;color:var(--muted);flex-wrap:wrap}
.d-quiet .rule{width:48px;height:1px;background:var(--accent)}
.d-quiet .it{font-style:italic;color:var(--accent)}
.d-quiet section+section{border-top:1px solid var(--line)}
.d-quiet .q{display:grid;grid-template-columns:90px 1fr;padding:calc(30px*var(--space)) 0;border-bottom:1px solid var(--line);transition:background .3s}
.d-quiet .q:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.d-quiet .qs{border-top:1px solid var(--line)}
.d-quiet .num{font-family:var(--display);font-style:italic;color:var(--accent);font-size:calc(24px*var(--scale))}
.d-quiet .part{padding:28px 28px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.d-quiet .part h3{font-family:var(--display);font-weight:400;font-size:calc(30px*var(--scale))}

/* ---------- 02 Audit Log ---------- */
.d-log{font-family:var(--body)}
.d-log .mono{font-family:var(--mono)}
.d-log .statusbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding:14px clamp(16px,5vw,64px);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--muted)}
.d-log .flag{color:#FF7A6B}
.d-log .heroG{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:calc(56px*var(--space));padding:calc(72px*var(--space)) clamp(16px,5vw,64px)}
.d-log .log{font-family:var(--mono);font-size:calc(14px*var(--scale));line-height:1.75;color:var(--muted);display:flex;flex-direction:column;white-space:pre-wrap}
.d-log .log .cmd{color:var(--fg);margin-top:16px}
.d-log h1{font-weight:300;letter-spacing:-.03em}
@keyframes blink{50%{opacity:0}}
.d-log .cur{color:var(--accent);animation:blink 1.1s steps(1) infinite}
.d-log .qgrid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:calc(56px*var(--space))}
.d-log .qrow{padding:24px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.d-log .qrow .t{display:flex;gap:20px}
.d-log .opts{display:flex;gap:10px;padding-left:44px;flex-wrap:wrap}
.d-log .opt{font-family:var(--mono);font-size:13px;padding:10px 16px;min-height:44px;background:transparent;color:var(--muted);border:1px solid var(--line)}
.d-log .opt:hover{border-color:var(--muted)}
.d-log .opt.on-clean{background:#13200F;color:#9FE08A;border-color:#9FE08A}
.d-log .opt.on-none{background:#231110;color:#FF8A7A;border-color:#FF7A6B}
.d-log .verdict{margin-top:20px;padding:22px;border:1px solid var(--line);background:color-mix(in srgb,var(--fg) 3%,var(--bg));font-family:var(--mono);display:flex;flex-direction:column;gap:10px}
.d-log .card{padding:24px;border:1px solid var(--line);background:color-mix(in srgb,var(--fg) 2%,var(--bg));display:flex;flex-direction:column;gap:12px}
.d-log .card.last{border-color:var(--accent)}
.d-log .out{padding:28px;border:1px dashed var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;font-family:var(--mono);font-size:14px;line-height:1.7}
.d-log .out div{display:flex;flex-direction:column;gap:6px}

/* ---------- 03 Manifesto ---------- */
.d-man .big{font-family:var(--display);text-transform:uppercase;line-height:.86;font-size:calc(clamp(64px,15.5vw,236px)*var(--scale));letter-spacing:-.01em;display:block}
.d-man .hero{padding:calc(40px*var(--space)) clamp(16px,4vw,56px) calc(48px*var(--space));display:flex;flex-direction:column;gap:calc(48px*var(--space))}
.d-man .top{display:flex;justify-content:space-between;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.d-man .band{background:var(--accent);color:var(--bg);padding:24px clamp(16px,4vw,56px);font-family:var(--display);text-transform:uppercase;font-size:calc(clamp(24px,3vw,44px)*var(--scale));line-height:1.05}
.d-man .h2{font-family:var(--display);text-transform:uppercase;font-weight:400;line-height:.92}
.d-man .qrow{display:grid;grid-template-columns:minmax(80px,200px) 1fr;align-items:center;gap:16px;padding:24px clamp(16px,4vw,56px);border-top:2px solid var(--fg);transition:background .25s}
.d-man .qrow:last-child{border-bottom:2px solid var(--fg)}
.d-man .qrow:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.d-man .n{font-family:var(--display);font-size:calc(clamp(72px,9vw,140px)*var(--scale));line-height:.85;color:transparent;-webkit-text-stroke:2px var(--fg)}
.d-man .qtext{font-weight:500}
.d-man .slab{background:var(--fg);color:var(--bg);padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.d-man .slab span:first-child{font-family:var(--display);text-transform:uppercase;font-size:calc(clamp(36px,4.4vw,64px)*var(--scale));line-height:1}
.d-man .slab span:last-child{max-width:440px;font-weight:500}
.d-man .slab.hot{background:var(--accent)}

/* ---------- 04 Two Worlds ---------- */
.d-two .split{background:linear-gradient(90deg,var(--bg) 50%,var(--bg2) 50%);position:relative}
.d-two .seam{position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:linear-gradient(var(--accent),var(--accent2))}
.d-two .l{color:var(--fg)}
.d-two .r{color:var(--fg2,#E6F1F8)}
.d-two .serif{font-family:var(--display)}
.d-two .sans{font-family:var(--body);font-weight:300}
.d-two .halves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.d-two .half{padding:calc(64px*var(--space)) clamp(16px,5vw,80px);display:flex;flex-direction:column;gap:calc(48px*var(--space));justify-content:space-between}
.d-two h1,.d-two h2,.d-two h3{font-weight:400}
.d-two .pill{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:12px 22px;background:#0A0A0A;border:1px solid #3A3A3A;border-radius:999px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;z-index:2;color:#F2F2F2}
.d-two .ey.l{color:var(--accent)}
.d-two .ey.r{color:var(--accent2);text-align:right}
.d-two .box{background:#0A0A0A;border:1px solid #2E2E2E;padding:calc(40px*var(--space)) clamp(16px,3vw,48px);display:flex;flex-direction:column;gap:28px;color:#F2F2F2;position:relative;z-index:1}
.d-two .ctr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;flex-wrap:wrap}
.d-two .step{width:44px;height:44px;border:1px solid #444;background:transparent;font-size:20px}
.d-two .step:hover{background:rgba(255,255,255,.08)}
.d-two .val{font-size:40px;font-weight:600;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.d-two .bar2{display:flex;height:18px}
.d-two .bar2 div{transition:width .35s ease}
.d-two .ratio{font-size:calc(52px*var(--scale));font-weight:300;font-variant-numeric:tabular-nums}
.d-two .scard{padding:24px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.d-two .scard.p{background:color-mix(in srgb,var(--accent) 8%,var(--bg));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.d-two .scard.f{background:color-mix(in srgb,var(--accent2) 8%,var(--bg2));border:1px solid color-mix(in srgb,var(--accent2) 30%,transparent)}
.d-two .scard.f.last{border-color:var(--accent2)}
.d-two .wk{display:flex;justify-content:space-between;font-size:13px;color:#9A9A9A;position:relative;z-index:1}
.d-two .track{height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));position:relative;z-index:1}

/* ---------- 05 Decision Graph ---------- */
.d-graph .disp{font-family:var(--display);font-weight:300;letter-spacing:-.01em}
.d-graph .mono{font-family:var(--mono)}
.d-graph .heroG{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:calc(48px*var(--space));align-items:center}
.d-graph svg{width:100%;height:auto;display:block}
@keyframes pulse{50%{opacity:1}0%,100%{opacity:.4}}
.d-graph .pulse{animation:pulse 2.4s ease-in-out infinite}
.d-graph .nodes{position:relative;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.d-graph .nodes::before{content:"";position:absolute;left:40px;right:40px;top:50%;height:1px;background:var(--line)}
.d-graph .node{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:44px;padding:14px 20px;border-radius:999px;background:color-mix(in srgb,var(--fg) 3%,var(--bg));color:var(--fg);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));text-align:left;transition:transform .2s,background .2s}
.d-graph .node:hover{transform:translateY(-2px)}
.d-graph .node.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.d-graph .node small{font-family:var(--mono);font-size:11px;opacity:.8}
.d-graph .detail{padding:calc(48px*var(--space)) clamp(16px,4vw,56px);border:1px solid var(--line);background:color-mix(in srgb,var(--fg) 2%,var(--bg));display:grid;grid-template-columns:100px 1fr;gap:20px;min-height:220px}
.d-graph .chain{display:flex;flex-direction:column}
.d-graph .chain .node{width:100%;border-radius:14px}
.d-graph .chain .node.on{background:color-mix(in srgb,var(--accent) 16%,var(--bg));color:var(--fg)}
.d-graph .link{width:1px;height:30px;margin-left:34px;background:var(--line)}
.d-graph .sgrid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:calc(40px*var(--space))}
.d-graph .panel2{padding:clamp(24px,3vw,44px);border:1px solid var(--accent);background:color-mix(in srgb,var(--fg) 2%,var(--bg));display:flex;flex-direction:column;gap:20px}

@media (max-width:900px){
.layout,.layout.closed{grid-template-columns:1fr}
.panel{position:fixed;left:0;right:0;bottom:0;top:auto;height:62vh;border-left:0;border-top:1px solid var(--ui-line);z-index:30;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.grid4,.d-log .out{grid-template-columns:repeat(2,minmax(0,1fr))}
.split2,.d-log .heroG,.d-log .qgrid,.d-graph .heroG,.d-graph .sgrid{grid-template-columns:1fr}
}
@media (max-width:600px){
.grid4,.d-log .out{grid-template-columns:1fr}
.d-two .halves{grid-template-columns:1fr}
.d-two .split{background:var(--bg2)}
.d-two .halves>.half:first-child{background:var(--bg)}
.d-two .seam,.d-two .pill{display:none}
.d-quiet .q{grid-template-columns:48px 1fr}
.d-graph .detail{grid-template-columns:1fr}
.d-graph .nodes::before{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="bar">
  <span class="brand">GP Design Lab</span>
  <nav class="tabs" role="tablist" aria-label="Design directions" id="tabs"></nav>
  <button class="tbtn" id="editBtn" aria-pressed="false">Edit text</button>
  <button class="tbtn" id="panelBtn" aria-pressed="true">Design panel</button>
</header>

<div class="layout" id="layout">
  <main class="stage" id="stage" aria-live="polite"></main>
  <aside class="panel" id="panel" aria-label="Design controls">
    <h2 id="panelTitle">Direction</h2>
    <div class="row2">
      <div class="field"><label for="c-accent">Accent</label><div class="color"><input type="color" id="c-accent" data-var="accent"><code></code></div></div>
      <div class="field"><label for="c-accent2">Accent 2</label><div class="color"><input type="color" id="c-accent2" data-var="accent2"><code></code></div></div>
      <div class="field"><label for="c-bg">Background</label><div class="color"><input type="color" id="c-bg" data-var="bg"><code></code></div></div>
      <div class="field"><label for="c-bg2">Background 2</label><div class="color"><input type="color" id="c-bg2" data-var="bg2"><code></code></div></div>
      <div class="field"><label for="c-fg">Text</label><div class="color"><input type="color" id="c-fg" data-var="fg"><code></code></div></div>
      <div class="field"><label for="c-muted">Muted text</label><div class="color"><input type="color" id="c-muted" data-var="muted"><code></code></div></div>
    </div>
    <div class="field"><label for="f-display">Display font</label><select id="f-display" data-var="display"></select></div>
    <div class="field"><label for="f-body">Body font</label><select id="f-body" data-var="body"></select></div>
    <div class="field"><label for="r-scale">Type size <span id="scaleOut"></span></label><input type="range" id="r-scale" min="0.75" max="1.35" step="0.05" data-var="scale"></div>
    <div class="field"><label for="r-space">Spacing <span id="spaceOut"></span></label><input type="range" id="r-space" min="0.5" max="1.6" step="0.05" data-var="space"></div>
    <p class="hint">Changes save in this browser. Turn on <b>Edit text</b> to rewrite any line in place. When you're happy, copy the settings and paste them back to Claude to build the full page.</p>
    <div class="actions">
      <button class="tbtn" id="copyBtn">Copy settings for Claude</button>
      <button class="tbtn" id="resetBtn">Reset this direction</button>
    </div>
  </aside>
</div>

<script>
(function(){
const FONTS=[
 ["Newsreader","'Newsreader',Georgia,serif"],["Libre Caslon Text","'Libre Caslon Text',Georgia,serif"],
 ["Anton","'Anton',Impact,sans-serif"],["Unbounded","'Unbounded',system-ui,sans-serif"],
 ["Geist","'Geist',system-ui,sans-serif"],["Sora","'Sora',system-ui,sans-serif"],
 ["Archivo","'Archivo',system-ui,sans-serif"],["IBM Plex Sans","'IBM Plex Sans',system-ui,sans-serif"],
 ["Instrument Sans","'Instrument Sans',system-ui,sans-serif"],["Geist Mono","'Geist Mono',ui-monospace,monospace"],
 ["IBM Plex Mono","'IBM Plex Mono',ui-monospace,monospace"]];
const F=n=>FONTS.find(f=>f[0]===n)[1];

const DIRS=[
 {id:"quiet",name:"Quiet Authority",cls:"d-quiet",d:{accent:"#D2B084",accent2:"#D2B084",bg:"#12100E",bg2:"#12100E",fg:"#ECE6DC",muted:"#A59C8F",display:"Newsreader",body:"Instrument Sans",scale:1,space:1,line:"#2B2723",mono:"Geist Mono"}},
 {id:"log",name:"Audit Log",cls:"d-log",d:{accent:"#FFB547",accent2:"#FF7A6B",bg:"#0A0B0A",bg2:"#0A0B0A",fg:"#E6E8E3",muted:"#8C928A",display:"Geist",body:"Geist",scale:1,space:1,line:"#262A26",mono:"Geist Mono"}},
 {id:"man",name:"Manifesto",cls:"d-man",d:{accent:"#FF4A1C",accent2:"#FF4A1C",bg:"#0A0A0A",bg2:"#0A0A0A",fg:"#F2EEE6",muted:"#B7B1A7",display:"Anton",body:"Archivo",scale:1,space:1,line:"#F2EEE6",mono:"Geist Mono"}},
 {id:"two",name:"Two Worlds",cls:"d-two",d:{accent:"#D39A62",accent2:"#5CC8FF",bg:"#17130F",bg2:"#0B1117",fg:"#DCCFBC",muted:"#A89A86",display:"Libre Caslon Text",body:"Sora",scale:1,space:1,line:"#2A2A2A",mono:"Geist Mono"}},
 {id:"graph",name:"Decision Graph",cls:"d-graph",d:{accent:"#9B8CFF",accent2:"#FF7A6B",bg:"#07080D",bg2:"#07080D",fg:"#E9EBF5",muted:"#A3A9C2",display:"Unbounded",body:"IBM Plex Sans",scale:1,space:1,line:"#262B45",mono:"IBM Plex Mono"}}
];

const Q=[
 ["Ask the CEO what this company is becoming. Ask the janitor.","Do you get the same answer.","Same answer?"],
 ["Name the last person who said out loud that a process should stop existing.","What happened to them.","The last dissenter"],
 ["Every name on the transformation team was chosen for knowing how the company runs today.","Which of them was chosen for being willing to end it.","Willing to end it"],

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let cur=(()=>{try{return localStorage.getItem("gp.cur")||"quiet"}catch(_){return "quiet"}})();
if(location.hash&&DIRS.some(d=>d.id===location.hash.slice(1)))cur=location.hash.slice(1);
const settings={},edits={};
DIRS.forEach(d=>{settings[d.id]=Object.assign({},d.d,store.get("gp.s."+d.id)||{});edits[d.id]=store.get("gp.e."+d.id)});

const $=s=>document.querySelector(s),stage=$("#stage"),tabs=$("#tabs");
tabs.innerHTML=DIRS.map((d,i)=>`<button class="tab" role="tab" data-id="${d.id}"><small>0${i+1}</small>${d.name}</button>`).join("");
const fontOpts=FONTS.map(f=>`<option value="${f[0]}">${f[0]}</option>`).join("");
$("#f-display").innerHTML=fontOpts;$("#f-body").innerHTML=fontOpts;

function applyVars(){
 const s=settings[cur],st=stage.style;
 ["accent","accent2","bg","bg2","fg","muted","line"].forEach(k=>st.setProperty("--"+k,s[k]));
 st.setProperty("--display",F(s.display));st.setProperty("--body",F(s.body));st.setProperty("--mono",F(s.mono));
 st.setProperty("--scale",s.scale);st.setProperty("--space",s.space);
 if(cur==="two")st.setProperty("--fg2","#E6F1F8");
}
function syncPanel(){
 const s=settings[cur],d=DIRS.find(x=>x.id===cur);
 $("#panelTitle").textContent=d.name;
 document.querySelectorAll(".panel [data-var]").forEach(el=>{el.value=s[el.dataset.var];const c=el.parentElement.querySelector("code");if(c)c.textContent=String(s[el.dataset.var]).toUpperCase()});
 $("#scaleOut").textContent=Math.round(s.scale*100)+"%";$("#spaceOut").textContent=Math.round(s.space*100)+"%";
 const two=cur==="two";$("#c-bg2").closest(".field").style.opacity=two?1:.4;
}
const live={answers:{},biz:0,sys:0};
function render(){
 const d=DIRS.find(x=>x.id===cur);
 stage.className="stage "+d.cls;
 stage.innerHTML=edits[cur]||R[cur]();
 applyVars();syncPanel();setEditable();
 tabs.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.id===cur));
 live.answers={};live.biz=0;live.sys=0;
 try{localStorage.setItem("gp.cur",cur)}catch(_){}
}
function setEditable(){
 const on=document.body.classList.contains("editing");
 stage.querySelectorAll("[data-edit]").forEach(el=>{if(on)el.setAttribute("contenteditable","true");else el.removeAttribute("contenteditable")});
}

/* ---- events ---- */
tabs.addEventListener("click",ev=>{const b=ev.target.closest(".tab");if(!b)return;cur=b.dataset.id;render();window.scrollTo(0,0)});
document.querySelectorAll(".panel [data-var]").forEach(el=>el.addEventListener("input",()=>{
 const k=el.dataset.var;settings[cur][k]=el.type==="range"?parseFloat(el.value):el.value;
 store.set("gp.s."+cur,settings[cur]);applyVars();syncPanel();
}));
$("#editBtn").addEventListener("click",function(){
 const on=document.body.classList.toggle("editing");this.setAttribute("aria-pressed",on);setEditable();
 if(!on)saveEdits();
});
function saveEdits(){
 const clone=stage.cloneNode(true);clone.querySelectorAll("[contenteditable]").forEach(n=>n.removeAttribute("contenteditable"));
 edits[cur]=clone.innerHTML;store.set("gp.e."+cur,edits[cur]);
}
stage.addEventListener("input",()=>{clearTimeout(saveEdits.t);saveEdits.t=setTimeout(saveEdits,400)});
$("#panelBtn").addEventListener("click",function(){const open=!$("#layout").classList.toggle("closed");this.setAttribute("aria-pressed",open)});
$("#resetBtn").addEventListener("click",()=>{
 const d=DIRS.find(x=>x.id===cur);settings[cur]=Object.assign({},d.d);edits[cur]=null;
 try{localStorage.removeItem("gp.s."+cur);localStorage.removeItem("gp.e."+cur)}catch(_){}
 render();toast("Reset "+d.name);
});
$("#copyBtn").addEventListener("click",()=>{
 const d=DIRS.find(x=>x.id===cur),s=settings[cur];
 const changed=Object.keys(s).filter(k=>s[k]!==d.d[k]).map(k=>`  ${k}: ${d.d[k]} → ${s[k]}`);
 const txt=`GP Design Lab — chosen direction: ${d.name}\nSettings:\n${Object.keys(s).map(k=>`  ${k}: ${s[k]}`).join("\n")}\nChanged from default:\n${changed.length?changed.join("\n"):"  (none)"}\nText edited: ${edits[cur]?"yes":"no"}`;
 const done=()=>toast("Settings copied. Paste them to Claude.");
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt))}else fallback(txt);
});
function fallback(txt){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Settings copied. Paste them to Claude.")}catch(_){toast("Copy blocked. Select the text in the box.")}ta.remove()}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* interactive bits (delegated, survive text edits) */
stage.addEventListener("click",ev=>{
 if(document.body.classList.contains("editing")&&ev.target.closest("[data-edit]"))return;
 const o=ev.target.closest(".opt");
 if(o){const i=o.dataset.q;live.answers[i]=o.dataset.v;
  stage.querySelectorAll(`.opt[data-q="${i}"]`).forEach(b=>b.className="opt"+(b.dataset.v===o.dataset.v?" on-"+o.dataset.v:""));
  const a=Object.values(live.answers),n=a.length,miss=a.filter(v=>v==="none").length;
  $("#vcount").textContent=`result · ${n}/5 checked · ${miss} without answer`;
  const vt=$("#vtext"),box=$("#verdict");
  if(miss){vt.textContent="No clean answers. That is the moment. Before implementation begins is the cheapest version.";vt.style.color="#FF8A7A";box.style.borderColor="#FF7A6B"}
  else if(n===5){vt.textContent="Five clean answers. In a programme that is working, every one of them has an answer.";vt.style.color="#9FE08A";box.style.borderColor="#9FE08A"}
  return}
 const st=ev.target.closest(".step");
 if(st){const k=st.dataset.k;live[k]=Math.max(0,Math.min(99,live[k]+parseInt(st.dataset.d,10)));
  const tot=live.biz+live.sys,bp=tot?live.biz/tot*100:50;
  $("#bizV").textContent=$("#bizR").textContent=live.biz;$("#sysV").textContent=$("#sysR").textContent=live.sys;
  $("#bizB").style.width=bp+"%";$("#sysB").style.width=(100-bp)+"%";return}
 const gq=ev.target.closest("[data-gq]");
 if(gq){const i=+gq.dataset.gq;stage.querySelectorAll("[data-gq]").forEach(b=>b.classList.toggle("on",b===gq));
  $("#gqn").textContent="0"+(i+1);$("#gqt").textContent=Q[i][0]+" "+Q[i][1];return}
 const gp=ev.target.closest("[data-gp]");
 if(gp){const i=+gp.dataset.gp;stage.querySelectorAll("[data-gp]").forEach(b=>b.classList.toggle("on",b===gp));
  $("#gpn").textContent="0"+(i+1)+" · "+P[i][0];$("#gpl").textContent=P[i][1];$("#gpb").textContent=P[i][2]}
});
render();
})();
</script>
